<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-labelledby="title description">
  <title id="title">Personal Gemini Journal architecture</title>
  <desc id="description">Browser Firebase clients connect to Firebase Authentication, Firebase App Check, Firestore owner-scoped reads, and a single Cloud Run service. Cloud Run verifies identity and App Check, calls Gemini with Secret Manager credentials, writes through Firebase Admin, and receives a protected daily retention request from Cloud Scheduler.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7fafc"/>
      <stop offset="1" stop-color="#edf4f7"/>
    </linearGradient>
    <linearGradient id="browser" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e6f4f1"/>
      <stop offset="1" stop-color="#d6e9e8"/>
    </linearGradient>
    <linearGradient id="run" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff3df"/>
      <stop offset="1" stop-color="#f6dfb7"/>
    </linearGradient>
    <linearGradient id="data" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e9e4f7"/>
      <stop offset="1" stop-color="#d9d0ed"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#18323b" flood-opacity="0.14"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#42616a"/>
    </marker>
    <marker id="secureArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1c7c72"/>
    </marker>
    <style>
      .title { font: 700 31px Georgia, 'Times New Roman', serif; fill: #17343d; }
      .subtitle { font: 400 16px Arial, sans-serif; fill: #4b6269; }
      .section { font: 700 14px Arial, sans-serif; letter-spacing: 1.7px; fill: #477078; }
      .card-title { font: 700 18px Arial, sans-serif; fill: #17343d; }
      .body { font: 400 14px Arial, sans-serif; fill: #29444c; }
      .small { font: 400 12px Arial, sans-serif; fill: #536970; }
      .label { font: 700 12px Arial, sans-serif; fill: #2d555e; }
      .box { stroke: #9db4b8; stroke-width: 1.5; rx: 16; filter: url(#shadow); }
      .line { stroke: #42616a; stroke-width: 2.2; fill: none; marker-end: url(#arrow); }
      .secure-line { stroke: #1c7c72; stroke-width: 2.4; fill: none; marker-end: url(#secureArrow); }
      .dashed { stroke-dasharray: 8 7; }
      .boundary { fill: none; stroke: #7ea2a5; stroke-width: 2; stroke-dasharray: 10 8; rx: 22; }
      .boundary-label { font: 700 13px Arial, sans-serif; letter-spacing: 1px; fill: #477078; }
    </style>
  </defs>

  <rect width="1600" height="980" fill="url(#background)"/>
  <text x="70" y="62" class="title">Personal Gemini Journal</text>
  <text x="70" y="91" class="subtitle">Actual application topology: browser identity, Cloud Run policy boundary, Firebase data, Gemini processing, and privacy retention.</text>
  <text x="70" y="126" class="section">RUNTIME DATA PLANE</text>

  <rect x="45" y="145" width="1510" height="570" class="boundary"/>
  <text x="70" y="170" class="boundary-label">USER AND SERVICE TRUST BOUNDARIES</text>

  <rect x="75" y="205" width="310" height="390" fill="url(#browser)" class="box"/>
  <text x="100" y="241" class="card-title">Browser: React dashboard</text>
  <text x="100" y="271" class="body">Google Sign-In via Firebase Auth</text>
  <text x="100" y="297" class="body">reCAPTCHA Enterprise App Check</text>
  <text x="100" y="323" class="body">Entry and reply composer</text>
  <text x="100" y="349" class="body">Privacy Guardian decisions</text>
  <text x="100" y="375" class="body">Calendar v1 and related graph</text>
  <text x="100" y="401" class="body">Integrity and security activity</text>
  <text x="100" y="427" class="body">Delete entry / delete journal</text>
  <line x1="100" y1="463" x2="357" y2="463" stroke="#9db4b8"/>
  <text x="100" y="490" class="label">READ PATH</text>
  <text x="100" y="513" class="small">Firestore realtime reads use</text>
  <text x="100" y="532" class="small">the signed-in user's /users/{uid}</text>
  <text x="100" y="551" class="small">namespace and rules.</text>
  <text x="100" y="578" class="small">No browser write access to data.</text>

  <rect x="510" y="190" width="480" height="455" fill="url(#run)" class="box"/>
  <text x="540" y="228" class="card-title">Cloud Run: personal-gemini-journal</text>
  <text x="540" y="253" class="small">One Node.js container serves the frontend and API</text>
  <rect x="540" y="275" width="420" height="67" fill="#fffaf0" stroke="#d8bd88" rx="10"/>
  <text x="560" y="301" class="label">REQUEST GATES</text>
  <text x="560" y="324" class="body">CORS / COOP -> Firebase ID token -> App Check</text>
  <rect x="540" y="365" width="195" height="104" fill="#fffaf0" stroke="#d8bd88" rx="10"/>
  <text x="560" y="391" class="label">JOURNAL API</text>
  <text x="560" y="415" class="small">POST /api/entries</text>
  <text x="560" y="435" class="small">POST /api/entries/:id/reply</text>
  <text x="560" y="455" class="small">POST /api/delete-data</text>
  <rect x="765" y="365" width="195" height="104" fill="#fffaf0" stroke="#d8bd88" rx="10"/>
  <text x="785" y="391" class="label">CONTROLS</text>
  <text x="785" y="415" class="small">PII scan and redaction</text>
  <text x="785" y="435" class="small">Rate and token budgets</text>
  <text x="785" y="455" class="small">Idempotency and hashes</text>
  <rect x="540" y="492" width="420" height="115" fill="#fffaf0" stroke="#d8bd88" rx="10"/>
  <text x="560" y="518" class="label">ADMIN SDK WRITE BOUNDARY</text>
  <text x="560" y="542" class="body">Writes entries, turns, audit, usage, chain,</text>
  <text x="560" y="563" class="body">tombstones, retention archives, and redactions.</text>
  <text x="560" y="590" class="small">Runtime SA: personal-gemini-journal-run</text>

  <rect x="1100" y="205" width="385" height="235" fill="url(#data)" class="box"/>
  <text x="1130" y="241" class="card-title">Cloud Firestore</text>
  <text x="1130" y="273" class="body">users/{uid}/entries</text>
  <text x="1130" y="296" class="body">entries/{entryId}/conversation</text>
  <text x="1130" y="319" class="body">meta, usage, audit</text>
  <text x="1130" y="342" class="body">retentionEntries / retentionTurns</text>
  <line x1="1130" y1="367" x2="1455" y2="367" stroke="#aa9ac5"/>
  <text x="1130" y="393" class="label">SECURITY RULES</text>
  <text x="1130" y="415" class="small">Owner-scoped reads; client writes denied.</text>

  <rect x="1100" y="490" width="385" height="155" fill="#eaf5f3" class="box"/>
  <text x="1130" y="526" class="card-title">Gemini API</text>
  <text x="1130" y="556" class="body">Structured summaries, topics, categories,</text>
  <text x="1130" y="579" class="body">reflection prompts, and conversation replies.</text>
  <text x="1130" y="612" class="small">Receives bounded input; Privacy Guardian</text>
  <text x="1130" y="630" class="small">redacts detected content unless consented.</text>

  <rect x="1100" y="682" width="385" height="92" fill="#f6e7d1" class="box"/>
  <text x="1130" y="716" class="card-title">Secret Manager</text>
  <text x="1130" y="744" class="body">GEMINI_API_KEY, DELETION_HMAC_KEY,</text>
  <text x="1130" y="763" class="body">RETENTION_WORKER_TOKEN at runtime only</text>

  <path d="M 385 320 C 435 320, 455 320, 510 320" class="secure-line"/>
  <text x="397" y="307" class="label">ID token + App Check</text>
  <path d="M 385 500 C 435 500, 455 500, 510 500" class="line dashed"/>
  <text x="397" y="486" class="label">same-origin reads / API calls</text>
  <path d="M 990 430 C 1040 430, 1060 350, 1100 350" class="secure-line"/>
  <text x="1010" y="375" class="label">Admin SDK</text>
  <path d="M 990 545 C 1045 545, 1055 570, 1100 570" class="secure-line"/>
  <text x="1010" y="532" class="label">bounded Gemini call</text>
  <path d="M 1100 724 C 1040 724, 1035 583, 960 583" class="secure-line dashed"/>
  <text x="985" y="692" class="label">runtime secret access</text>
  <path d="M 385 402 C 550 402, 840 270, 1100 300" class="line dashed"/>
  <text x="645" y="300" class="label">Firestore owner-scoped realtime reads</text>

  <text x="70" y="752" class="section">RETENTION CONTROL PLANE</text>
  <rect x="75" y="785" width="390" height="105" fill="#e8eff6" class="box"/>
  <text x="100" y="821" class="card-title">Cloud Scheduler</text>
  <text x="100" y="850" class="body">personal-gemini-journal-retention</text>
  <text x="100" y="873" class="small">Daily 02:00 UTC -> POST /internal/retention/redact</text>
  <rect x="555" y="785" width="435" height="105" fill="#fff3df" class="box"/>
  <text x="580" y="821" class="card-title">Private retention worker</text>
  <text x="580" y="850" class="body">Worker token boundary; bounded batch; idempotent</text>
  <text x="580" y="873" class="small">Archives for 30 days, then replaces readable text with Deleted.</text>
  <rect x="1080" y="785" width="405" height="105" fill="#e9e4f7" class="box"/>
  <text x="1105" y="821" class="card-title">Audit and integrity evidence</text>
  <text x="1105" y="850" class="body">Audit remains; hashes and minimal lifecycle metadata remain.</text>
  <text x="1105" y="873" class="small">Deleted content is hidden from the journal UI immediately.</text>
  <path d="M 465 837 C 500 837, 520 837, 555 837" class="secure-line"/>
  <path d="M 990 837 C 1025 837, 1045 837, 1080 837" class="secure-line"/>

  <text x="70" y="935" class="small">Deployment: Docker -> Cloud Build (separate build SA) -> Artifact Registry -> Cloud Run (dedicated runtime SA).</text>
  <text x="930" y="935" class="small">Required service label: dev-tutorial=cloud-run-ai-challenge</text>
</svg>
